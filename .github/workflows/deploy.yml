name: build-and-push

# Builds the Docker image and pushes it to OCI Container Registry (OCIR).
# Container Instances pull the image at create time, so after this runs you
# recreate the instance (console, or the CLI command in the README) to deploy.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          # e.g. ord.ocir.io (Chicago), iad.ocir.io (Ashburn), fra.ocir.io (Frankfurt)
          registry: ${{ secrets.OCIR_REGISTRY }}
          # format: <tenancy-namespace>/<oci-username>
          username: ${{ secrets.OCIR_USERNAME }}
          # an OCI Auth Token (User > Auth Tokens), NOT your console password
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/confidence-engine:latest
            ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/confidence-engine:${{ github.sha }}
