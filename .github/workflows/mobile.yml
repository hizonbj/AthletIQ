name: mobile

# Typecheck, lint, and test the Expo app in mobile/.
#
# The timezone matrix is not incidental: a day label derived from UTC filed
# evening sessions against the next day and eastern-hemisphere mornings against
# the previous one, and the tests that should have caught it passed because CI
# and the author's machine both ran in UTC.

on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'mobile/**', '.github/workflows/mobile.yml' ]
  pull_request:
    paths: [ 'mobile/**', '.github/workflows/mobile.yml' ]
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # UTC, a western offset, an eastern one, a half-hour offset, and the
        # furthest-forward zone there is.
        timezone:
          - UTC
          - America/Los_Angeles
          - Australia/Sydney
          - Asia/Kolkata
          - Pacific/Kiritimati
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Test (TZ=${{ matrix.timezone }})
        run: npm test
        env:
          TZ: ${{ matrix.timezone }}

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Typechecking does not prove the app links: this catches a screen that
      # imports something Metro cannot resolve.
      - name: Bundle
        run: npx expo export --platform web
